<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی اتوبوس</title>
<style>
:root{--bg:#d9e8f5;--panel:#bcd0e6;--ink:#14304d;--slot:#2b3d58;--btn:#1f7ae0;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a29;--panel:#1a2b42;--ink:#e6eef8;--slot:#0a111d;--btn:#3a8cf0}}
:root[data-theme="dark"]{--bg:#0f1a29;--panel:#1a2b42;--ink:#e6eef8;--slot:#0a111d;--btn:#3a8cf0;color-scheme:dark}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;box-sizing:border-box}
#top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:420px;font-size:20px;font-weight:700}
.row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:34px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.dot.first{width:32px;height:32px;border-width:3px}
.slot{width:44px;height:30px;border-radius:8px;background:var(--slot);border:2px solid rgba(255,255,255,.15)}
.slot.on{border-color:#fff}
#board{position:relative;background-color:var(--panel);background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:var(--s,44px) var(--s,44px);border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.18);touch-action:manipulation}
.bus{position:absolute;box-sizing:border-box;border-radius:14px;border:2px solid rgba(255,255,255,.6);box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 -6px 0 rgba(0,0,0,.14),inset 0 6px 0 rgba(255,255,255,.38);display:flex;align-items:center;justify-content:space-around;gap:3px;padding:4px;cursor:pointer;transition:transform .35s ease-in,opacity .35s}.bus.v{flex-direction:column}.bus i{flex:1;align-self:stretch;margin:2px;background:linear-gradient(#d8eeff,#5fa3e0);border-radius:6px;box-shadow:inset 0 0 0 2px rgba(0,40,90,.35)}.bus b{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#fff;color:#14304d;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1}
.bus.no{animation:no .25s}
@keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
#ov div{background:var(--bg);color:var(--ink);border-radius:16px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:320px}
#ov h2{margin:0}
#hint{font-size:13px;opacity:.75;text-align:center}.bus{border:0;box-shadow:none;background:none!important;padding:0;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}.bus svg{width:100%;height:100%;display:block}.bus b{position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:18px;height:18px;font-size:12px}.bus.v b{top:auto;bottom:-3px}
</style>
</head>
<body>
<div id="top"><span id="lv"></span><span id="sl"></span></div>
<div id="hint">صف مسافران (رنگ نوبت): اتوبوس همرنگ در جایگاه سوار می‌کند</div>
<div class="row" id="queue"></div>
<div class="row" id="slots"></div>
<div id="board"></div>
<button id="adBtn">+ جایگاه اضافه (تبلیغ ویدیویی)</button>
<div id="ov"><div><h2 id="ovt"></h2><div id="ovm"></div><button id="ovb1"></button><button id="ovb2" style="display:none"></button></div></div>
<script>
const COLORS=['#ff4d6d','#ffd23f','#3ddc84','#3d9bff','#ff9f1c','#a56bff','#19d3da'];
const D={L:[0,-1,'←'],R:[0,1,'→'],U:[-1,0,'↑'],D:[1,0,'↓']};
const N=6;let S=44,level=1,buses=[],queue=[],slots=[],maxSlots=4,done=false;
const $=id=>document.getElementById(id);
const hz=b=>b.dir=='L'||b.dir=='R';
const cells=b=>hz(b)?[[b.r,b.c],[b.r,b.c+1]]:[[b.r,b.c],[b.r+1,b.c]];
function occMap(list){const o={};list.forEach(b=>cells(b).forEach(x=>o[x[0]*N+x[1]]=b.id));return o}
function clear(b,o){
  const [dr,dc]=D[b.dir],cs=cells(b);
  const f=cs.reduce((a,x)=>x[0]*dr+x[1]*dc>a[0]*dr+a[1]*dc?x:a,cs[0]);
  let r=f[0]+dr,c=f[1]+dc;
  while(r>=0&&c>=0&&r<N&&c<N){if(o[r*N+c]!==undefined)return false;r+=dr;c+=dc}
  return true;
}
function gen(n){
  const nc=Math.min(3+Math.ceil(level/2),7);
  for(let t=0;t<300;t++){
    const occ={},bs=[];
    for(let i=0,k=0;i<n&&k<400;k++){
      const dir='LRUD'[Math.random()*4|0],h=dir=='L'||dir=='R';
      const b={id:i,color:COLORS[Math.random()*nc|0],r:Math.random()*(h?N:N-1)|0,c:Math.random()*(h?N-1:N)|0,dir};
      const cs=cells(b);
      if(cs.some(x=>occ[x[0]*N+x[1]]!==undefined))continue;
      cs.forEach(x=>occ[x[0]*N+x[1]]=i);bs.push(b);i++;
    }
    if(bs.length<n)continue;
    const o={...occ},rem=[...bs],order=[];let prog=true;
    while(rem.length&&prog){prog=false;
      for(let k=0;k<rem.length;k++){const b=rem[k];
        if(clear(b,o)){cells(b).forEach(x=>delete o[x[0]*N+x[1]]);order.push(b.color);rem.splice(k,1);prog=true;break}}}
    if(!rem.length){
      for(let i=0;i<order.length;i+=3){const g=order.slice(i,i+3).sort(()=>Math.random()-.5);order.splice(i,g.length,...g)}
      return {bs,order};
    }
  }
  return gen(n-2);
}
function start(){
  S=Math.min(58,Math.floor((Math.min(window.innerWidth,420)-24)/N));
  const g=gen(Math.min(8+level*2,20));
  buses=g.bs;queue=g.order;slots=[];done=false;
  render();
}
function busSVG(b){const c=b.color,g='#1c2a4a';
  if(hz(b))return `<svg viewBox="0 0 100 50" style="${b.dir=='L'?'transform:scaleX(-1)':''}"><rect x="3" y="8" width="94" height="32" rx="11" fill="${c}" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/><rect x="8" y="10" width="84" height="7" rx="3.5" fill="#fff" opacity=".35"/><rect x="32" y="3" width="26" height="7" rx="3" fill="#fff" opacity=".85"/><rect x="9" y="16" width="16" height="11" rx="3" fill="${g}"/><rect x="29" y="16" width="16" height="11" rx="3" fill="${g}"/><rect x="49" y="16" width="16" height="11" rx="3" fill="${g}"/><rect x="69" y="14" width="23" height="15" rx="5" fill="${g}"/><circle cx="76" cy="21" r="4.3" fill="#fff"/><circle cx="86" cy="21" r="4.3" fill="#fff"/><circle cx="77" cy="22" r="2" fill="#111"/><circle cx="87" cy="22" r="2" fill="#111"/><path d="M78 34q6 4 12 0" stroke="${g}" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="24" cy="40" r="7" fill="#222"/><circle cx="24" cy="40" r="3" fill="#aaa"/><circle cx="74" cy="40" r="7" fill="#222"/><circle cx="74" cy="40" r="3" fill="#aaa"/></svg>`;
  return `<svg viewBox="0 0 50 100"><rect x="4" y="7" width="42" height="84" rx="12" fill="${c}" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/><rect x="8" y="9" width="34" height="7" rx="3.5" fill="#fff" opacity=".35"/><rect x="14" y="2" width="22" height="7" rx="3" fill="#fff" opacity=".85"/><rect x="9" y="17" width="32" height="30" rx="8" fill="${g}"/><circle cx="18" cy="31" r="7" fill="#fff"/><circle cx="32" cy="31" r="7" fill="#fff"/><circle cx="19" cy="32" r="3" fill="#111"/><circle cx="33" cy="32" r="3" fill="#111"/><rect x="15" y="56" width="20" height="14" rx="5" fill="#eee"/><path d="M19 60h12M19 65h12" stroke="#999" stroke-width="1.5"/><circle cx="11" cy="78" r="4.5" fill="#ffe66d"/><circle cx="39" cy="78" r="4.5" fill="#ffe66d"/><rect x="1" y="68" width="5" height="18" rx="2" fill="#222"/><rect x="44" y="68" width="5" height="18" rx="2" fill="#222"/></svg>`}
function render(){
  const bd=$('board');bd.style.width=bd.style.height=N*S+'px';bd.style.setProperty('--s',S+'px');bd.innerHTML='';
  buses.forEach(b=>{
    const e=document.createElement('div');e.className='bus';e.id='b'+b.id;
    Object.assign(e.style,{left:b.c*S+2+'px',top:b.r*S+2+'px',width:(hz(b)?2*S:S)-4+'px',height:(hz(b)?S:2*S)-4+'px',});
    e.className='bus'+(hz(b)?'':' v');e.innerHTML=busSVG(b)+'<b>'+D[b.dir][2]+'</b>';e.onclick=()=>tap(b);bd.appendChild(e);
  });
  hud();
}
function hud(){
  $('lv').textContent='مرحله '+level;$('sl').textContent='جایگاه: '+slots.length+'/'+maxSlots;
  $('queue').innerHTML=queue.slice(0,9).map((c,i)=>`<span class="dot${i?'':' first'}" style="background:${c}"></span>`).join('');
  let s='';for(let i=0;i<maxSlots;i++){const c=slots[i];s+=`<span class="slot${c?' on':''}" style="${c?'background:'+c:''}"></span>`}
  $('slots').innerHTML=s;
}
function tap(b){
  if(done||!buses.includes(b))return;
  const e=$('b'+b.id);
  if(!clear(b,occMap(buses))||slots.length>=maxSlots){e.classList.remove('no');void e.offsetWidth;e.classList.add('no');return}
  buses=buses.filter(x=>x!==b);
  const [dr,dc]=D[b.dir];
  e.style.pointerEvents='none';e.style.transform=`translate(${dc*N*S}px,${dr*N*S}px)`;e.style.opacity=0;
  setTimeout(()=>e.remove(),400);
  slots.push(b.color);boarding();
}
function boarding(){
  let i;while((i=slots.indexOf(queue[0]))>-1){slots.splice(i,1);queue.shift()}
  hud();
  if(!buses.length&&!slots.length){done=true;show('آفرین! مرحله '+level+' تمام شد','',['مرحله بعد',()=>{level++;start()}])}
  else if(slots.length>=maxSlots&&buses.length){done=true;show('جایگاه‌ها پر شد','برای ادامه تبلیغ ببینید یا دوباره شروع کنید.',['ادامه (تبلیغ)',()=>ad(()=>{slots=[];done=false;boarding()})],['دوباره',start])}
}
function show(t,m,a,b){
  $('ovt').textContent=t;$('ovm').textContent=m;$('ov').style.display='flex';
  const b1=$('ovb1'),b2=$('ovb2');
  b1.textContent=a[0];b1.onclick=()=>{$('ov').style.display='none';a[1]()};
  b2.style.display=b?'':'none';
  if(b){b2.textContent=b[0];b2.onclick=()=>{$('ov').style.display='none';b[1]()}}
}
function ad(cb){
  $('ovt').textContent='تبلیغ نمایشی';$('ovm').textContent='اینجا SDK تبلیغ ویدیویی پخش می‌شود...';
  $('ov').style.display='flex';$('ovb1').style.display='none';$('ovb2').style.display='none';
  setTimeout(()=>{$('ov').style.display='none';$('ovb1').style.display='';cb()},1800);
}
$('adBtn').onclick=()=>{if(done||maxSlots>=7)return;ad(()=>{maxSlots++;hud()})};
start();
</script>
</body>
</html>
