name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www
          python3 -c "h=open('index.html',encoding='utf8').read();c=open('theme.css',encoding='utf8').read();open('www/index.html','w',encoding='utf8').write(h.replace('</style>',c+'</style>',1))"
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow && python3 icon.py
      - run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bus-jam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
